<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Mantia</title>
  <meta name="description" content="Acceso local a Mantia Servicios S.A.S.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/main.css">
  <script src="/js/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">M</div>
    <h1>Mantia</h1>
    <p id="login-instructions">Ingrese sus datos para continuar.</p>
    <form id="login-form">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" required minlength="3" maxlength="40"
        autocomplete="username" autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required
        minlength="8" maxlength="128" autocomplete="current-password">
      <label id="confirm-password-label" for="confirm-password" hidden>Confirmar contraseña</label>
      <input id="confirm-password" name="confirmPassword" type="password" minlength="8"
        maxlength="128" autocomplete="new-password" hidden>
      <button id="login-button" type="submit">Iniciar sesión</button>
      <p id="login-message" class="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
